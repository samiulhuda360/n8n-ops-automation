# Self-hosting: n8n backed by Postgres, plus the mock business systems.
#
#   cp .env.example .env            # then fill in the values
#   docker compose up -d
#   docker compose exec n8n n8n import:workflow --separate --input=/workflows
#
# n8n:            http://localhost:5678   (create the owner account on first visit)
# ops console:    http://localhost:8790
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command: python -m opsflow mock --host 0.0.0.0 --port 8790 --ai-mode ${AI_GATEWAY_MODE:-replay}
    environment:
      AI_UPSTREAM_URL: ${AI_UPSTREAM_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
    volumes:
      - ./:/app
    ports:
      - "8790:8790"

  n8n:
    image: n8nio/n8n:2.8.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Pacific/Auckland
      TZ: Pacific/Auckland
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # read by the workflows through $env
      MOCK_BASE_URL: http://mock:8790
      AI_BASE_URL: ${AI_BASE_URL:-http://mock:8790/ai/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gemini-flash-lite-latest}
      AI_MODE: ${AI_MODE:-on}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  postgres-data:
  n8n-data:
