[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsflow"
version = "1.0.0"
description = "Six AI-assisted n8n workflows for a small retailer, with mock services, guard rules and a measured time-saved model."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fpdf2>=2.7"]

[project.scripts]
opsflow = "opsflow.cli:main"

[tool.setuptools.packages.find]
include = ["opsflow*"]

[tool.setuptools.package-data]
opsflow = ["js/*.js"]

[tool.ruff]
line-length = 118
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Prompts, JavaScript glue and n8n expressions are kept on one line each so they read like the n8n editor shows them.
"opsflow/flows/*.py" = ["E501"]
"opsflow/mock/console.py" = ["E501"]
"opsflow/eval/report.py" = ["E501"]
