name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, workflow validation and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Validate the workflow files (wiring, no secrets, guards present)
        run: python -m opsflow validate
      - run: python -m pytest -q
      - name: Guard-rule unit tests (the JavaScript inside the Code nodes)
        run: node --test "tests/js/*.test.mjs"

  n8n-rules-path:
    name: Run every workflow in n8n on the rule-based path (no model)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: npm install -g n8n@2.8.4
      - name: Evaluate with the model switched off
        run: python -m opsflow eval --modes rules --gateway off
      - run: cat results/RESULTS.md
